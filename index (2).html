<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Tech Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body>
  <main class="container py-4 app-wrap">

    <!-- Header -->
    <header class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4 fw-bold m-0">Web Tech Quiz</h1>
      <button id="themeBtn" class="btn btn-outline-secondary btn-sm" aria-label="Toggle dark or light mode">Dark
        mode</button>
    </header>

    <!-- 1. Start screen -->
    <section id="startScreen" class="card-box text-center">
      <h2 class="h3 fw-bold">Test your web basics</h2>
      <p class="text-secondary">10 random questions on HTML, CSS, JavaScript and Bootstrap. You get 20 seconds for each
        question.</p>
      <input id="nameInput" type="text" class="form-control mx-auto mb-3 name-input"
        placeholder="Your name (for the PDF)">
      <button id="startBtn" class="btn btn-primary btn-lg px-5">Start quiz</button>
    </section>

    <!-- 2. Quiz screen -->
    <section id="quizScreen" class="card-box d-none">
      <div id="segBar" class="seg-bar mb-3" aria-label="Quiz progress"></div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <span id="qCount" class="text-secondary fw-medium"></span>
        <span id="timer" class="timer-badge">20s</span>
      </div>

      <h2 id="qText" class="h5 fw-semibold mb-3"></h2>
      <div id="options" class="d-grid gap-2"></div>

      <div class="text-end mt-4">
        <button id="nextBtn" class="btn btn-primary px-4 d-none">Next question</button>
      </div>
    </section>

    <!-- 3. Result screen -->
    <section id="resultScreen" class="card-box d-none">
      <h2 class="h3 fw-bold text-center">Quiz complete</h2>
      <p id="scoreText" class="display-5 fw-bold text-center my-2"></p>
      <p id="msgText" class="text-center text-secondary"></p>

      <div id="review" class="mb-4"></div>

      <div class="d-flex flex-wrap gap-2 justify-content-center">
        <button id="pdfBtn" class="btn btn-success">Download result as PDF</button>
        <button id="restartBtn" class="btn btn-outline-primary">Try again</button>
      </div>
    </section>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
